name: BTC 價格監控

# 定時任務：每1分鐘運行一次（由 cron-job.org 觸發）
on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install requests

      - name: 執行 BTC 價格監控
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python btc_monitor.py

      - name: 將最新狀態推回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add -A
          git diff --staged --quiet || git commit -m "chore: update btc state [skip ci]"
          git push
