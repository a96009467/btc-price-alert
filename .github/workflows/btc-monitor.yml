name: BTC 價格監控

on:
  # 每 1 分鐘執行一次（短線窗口監控需要高頻）
  schedule:
    - cron: "* * * * *"
  # 允許手動觸發測試
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install requests

      - name: 執行 BTC 價格監控
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          WINDOW_3MIN_UP: ${{ vars.WINDOW_3MIN_UP || '200' }}
          WINDOW_5MIN_CHG: ${{ vars.WINDOW_5MIN_CHG || '300' }}
          WINDOW_10MIN_CHG: ${{ vars.WINDOW_10MIN_CHG || '500' }}
        run: python btc_monitor.py

      - name: 將最新狀態推回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update btc price state [skip ci]"
          git push
