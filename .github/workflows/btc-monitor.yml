name: BTC 價格監控

# 定時任務：每1分鐘運行一次（由 cron-job.org 觸發）
on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 防止並發 run 同時讀寫 state.json（run 內有 30 秒雙採樣，需排隊）
concurrency:
  group: btc-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install requests

      - name: 執行 BTC 價格監控
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python btc_monitor.py

      - name: 將最新狀態推回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先保留本次算出的 state.json，避免 pull/rebase 產生衝突標記把檔案寫壞
          cp state.json /tmp/state_new.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state_new.json state.json
            git add state.json
            if git diff --staged --quiet; then
              echo "狀態無變化，結束"
              exit 0
            fi
            git commit -m "chore: update btc state [skip ci]"
            if git push origin HEAD:main; then
              echo "狀態推送成功"
              exit 0
            fi
            echo "推送失敗，重試 $i"
            sleep 3
          done
          echo "狀態推送最終失敗"
          exit 1
