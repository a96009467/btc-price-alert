<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC 即時K線圖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #131722;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 12px 16px;
            background: #1e222d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .price {
            font-size: 24px;
            font-weight: 700;
            color: #26a69a;
        }
        .widget-container {
            flex: 1;
            position: relative;
        }
        .tradingview-widget-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 BTC/USDT 即時走勢</h1>
        <div class="price" id="price">載入中...</div>
    </div>
    <div class="widget-container">
        <div class="tradingview-widget-container">
            <div id="tradingview_chart" style="height:100%; width:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "BINANCE:BTCUSDT",
                    "interval": "5",
                    "timezone": "Asia/Taipei",
                    "theme": "dark",
                    "style": "1",
                    "locale": "zh_TW",
                    "toolbar_bg": "#1e222d",
                    "enable_publishing": false,
                    "allow_symbol_change": false,
                    "container_id": "tradingview_chart"
                });
            </script>
        </div>
    </div>
    <script>
        // 每10秒更新一次頂部價格
        async function updatePrice() {
            try {
                const resp = await fetch('https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT');
                const data = await resp.json();
                document.getElementById('price').textContent = '$' + parseFloat(data.price).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
            } catch(e) {}
        }
        updatePrice();
        setInterval(updatePrice, 10000);
    </script>
</body>
</html>
